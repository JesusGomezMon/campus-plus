name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Tipos y compilación
        run: npm run build
      - name: Pruebas unitarias, de integración y de base de datos
        run: npm test
      - name: Pruebas E2E
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-e2e
          path: reportes/e2e
