<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="750" viewBox="0 0 1090 750">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9A96"/></marker>
    <marker id="fli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9A96"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="545" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B5124" text-anchor="middle">Arquitectura del sistema (cliente–servidor en la nube)</text>
  <rect x="40" y="90" width="250" height="400" rx="16" fill="#EAF5EC" stroke="#1E9E4A" stroke-width="1.6"/><text x="165" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B5124" text-anchor="middle">Dispositivo del usuario</text><text x="165" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">Teléfono / tablet / navegador</text><rect x="65" y="160" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#1E9E4A" stroke-width="1.6"/><text x="165" y="198.25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">PWA Campus+</text><text x="165" y="223.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">React 19 + TypeScript</text><text x="165" y="241.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Enrutador y pantallas</text><text x="165" y="258.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Reglas de dominio</text><rect x="65" y="340" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#CAA600" stroke-width="1.6"/><text x="165" y="378.25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">Service Worker</text><text x="165" y="403.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Workbox: caché de la</text><text x="165" y="421.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">aplicación (sin conexión)</text><text x="165" y="438.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">e instalación</text><rect x="410" y="320" width="230" height="140" rx="10" fill="#E6EFF8" stroke="#2F6FB0" stroke-width="1.6"/><text x="525" y="359.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">Vercel (CDN)</text><text x="525" y="385" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Hospeda los archivos</text><text x="525" y="402.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">estáticos compilados</text><text x="525" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">HTTPS, CSP, HSTS</text><text x="525" y="437.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Reescritura de rutas SPA</text><rect x="410" y="540" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#6B6B68" stroke-width="1.6"/><text x="525" y="574.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">GitHub</text><text x="525" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Repositorio y ramas</text><text x="525" y="617.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">GitHub Actions (CI):</text><text x="525" y="635" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">auditoría, compilación</text><text x="525" y="652.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">y 108 pruebas</text><rect x="750" y="90" width="300" height="420" rx="16" fill="#F4F7F4" stroke="#0B5124" stroke-width="1.6"/><text x="900" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B5124" text-anchor="middle">Supabase (nube)</text><rect x="775" y="140" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#1E9E4A" stroke-width="1.6"/><text x="900" y="175.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">Auth (GoTrue)</text><text x="900" y="201.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Correo + contraseña, JWT</text><rect x="775" y="235" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#1E9E4A" stroke-width="1.6"/><text x="900" y="270.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">API REST (PostgREST)</text><text x="900" y="296.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Consultas y RPC con el JWT</text><rect x="775" y="330" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#0B5124" stroke-width="1.6"/><text x="900" y="370.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1C1C1A" text-anchor="middle">PostgreSQL 15</text><text x="900" y="396.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Tablas: profiles, actividades,</text><text x="900" y="413.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">asignaciones, bitacora</text><text x="900" y="431.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">RLS por rol + privilegios</text><text x="900" y="448.75" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Función guardar_actividad</text><text x="900" y="466.25" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Triggers de auditoría</text><line x1="900" y1="220" x2="900" y2="235" stroke="#9A9A96" stroke-width="1.8" marker-end="url(#fl)"/><line x1="900" y1="315" x2="900" y2="330" stroke="#9A9A96" stroke-width="1.8" marker-end="url(#fl)"/><line x1="265" y1="190" x2="775" y2="180" stroke="#9A9A96" stroke-width="1.8" marker-end="url(#fl)"/><rect x="343.64" y="163" width="352.72" height="18" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="520" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">HTTPS: inicio de sesión (correo + contraseña → JWT)</text><line x1="265" y1="250" x2="775" y2="275" stroke="#9A9A96" stroke-width="1.8" marker-end="url(#fl)"/><rect x="407.48" y="243" width="225.04000000000002" height="18" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="520" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">HTTPS + JWT: consultas y cambios</text><line x1="410" y1="390" x2="265" y2="390" stroke="#9A9A96" stroke-width="1.8" marker-end="url(#fl)"/><rect x="282.6" y="366" width="110.80000000000001" height="18" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="338" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">descarga la app</text><line x1="525" y1="540" x2="525" y2="460" stroke="#9A9A96" stroke-width="1.8" marker-end="url(#fl)"/><rect x="449.44" y="493" width="151.12" height="18" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="525" y="505" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">despliegue automático</text><text x="545" y="710" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">Cliente ligero (SPA/PWA) + Backend como Servicio (BaaS): la lógica de negocio se valida en el cliente</text><text x="545" y="730" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B68" text-anchor="middle">y se hace cumplir en el servidor mediante RLS, restricciones y funciones de PostgreSQL.</text>
</svg>