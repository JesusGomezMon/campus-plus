  <polygon points="410,142 590,142 555,70 445,70" fill="#E6EFF8" stroke="#2F6FB0" stroke-width="1.6"/><text x="500" y="102" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1C1C1A" text-anchor="middle">E2E (Playwright + axe-core)</text><text x="500" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">28 casos · teléfono y tablet · WCAG AA</text><polygon points="340,220 660,220 625,148 375,148" fill="#EAF5EC" stroke="#1E9E4A" stroke-width="1.6"/><text x="500" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1C1C1A" text-anchor="middle">Integración UI (Testing Library)</text><text x="500" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">17 flujos: login y los 3 roles</text><polygon points="270,298 730,298 695,226 305,226" fill="#EAF5EC" stroke="#1E9E4A" stroke-width="1.6"/><text x="500" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1C1C1A" text-anchor="middle">Integración con Supabase real</text><text x="500" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">5 pruebas + 23 verificaciones RLS</text><polygon points="200,376 800,376 765,304 235,304" fill="#FBF3D4" stroke="#CAA600" stroke-width="1.6"/><text x="500" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1C1C1A" text-anchor="middle">Base de datos (PostgreSQL/PGlite)</text><text x="500" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B6B68" text-anchor="middle">19 pruebas: integridad, RLS, auditoría</text><polygon points="130,454 870,454 835,382 165,382" fill="#FBF3D4" stroke="#CAA600" stroke-width="1.6"/><text x="500" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill